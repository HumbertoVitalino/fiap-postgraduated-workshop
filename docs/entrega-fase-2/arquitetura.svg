<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 585" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a1a1a">
  <!-- Arquitetura de implantação da Fase 2: mesmos recursos e fluxos do diagrama mermaid do README,
       em layout compacto para caber numa página A4. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .node { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .edge { fill: none; stroke: #333; stroke-width: 1.3; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
      .label { font-size: 11px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .group-title { font-size: 12px; font-weight: 600; }
      .title { font-weight: 600; }
      .small { font-size: 11px; fill: #444; }
    </style>
  </defs>

  <!-- Grupos -->
  <rect x="20" y="180" width="240" height="110" rx="4" fill="#f8f0fc" stroke="#b07cc6"/>
  <rect x="340" y="70" width="560" height="460" rx="4" fill="#eef8fb" stroke="#4aa3c9"/>
  <text x="888" y="90" text-anchor="end" class="group-title">Azure (provisionada com Terraform, infra/)</text>
  <rect x="360" y="100" width="520" height="320" rx="4" fill="#fff7ee" stroke="#e0a050"/>
  <text x="372" y="120" class="group-title">VM Standard_D2s_v4 (Linux) com k3s</text>
  <rect x="540" y="135" width="320" height="270" rx="4" fill="#f2fbf6" stroke="#4caf7a"/>
  <text x="852" y="153" text-anchor="end" class="group-title">Namespace fiap-workshop</text>

  <!-- Desenvolvimento e pipeline -->
  <rect x="40" y="20" width="200" height="44" rx="3" class="node"/>
  <text x="140" y="46" text-anchor="middle">Desenvolvedor</text>
  <rect x="40" y="100" width="200" height="44" rx="3" class="node"/>
  <text x="140" y="126" text-anchor="middle">GitHub (repositório)</text>
  <text x="140" y="200" text-anchor="middle" class="group-title">GitHub Actions: pipeline da release</text>
  <text x="140" y="222" text-anchor="middle">Build</text>
  <text x="140" y="240" text-anchor="middle">Testes unitários e de integração</text>
  <text x="140" y="258" text-anchor="middle">SonarQube Cloud</text>
  <text x="140" y="276" text-anchor="middle">Imagem Docker</text>

  <!-- Usuários -->
  <rect x="512" y="4" width="196" height="50" rx="3" class="node"/>
  <text x="610" y="25" text-anchor="middle">Atendentes, mecânicos,</text>
  <text x="610" y="42" text-anchor="middle">sistema externo do orçamento</text>

  <!-- GHCR (cilindro) -->
  <path d="M915,258 v54 a45,8 0 0 0 90,0 v-54" class="node"/>
  <ellipse cx="960" cy="258" rx="45" ry="8" class="node"/>
  <text x="960" y="282" text-anchor="middle" class="title">GHCR</text>
  <text x="960" y="296" text-anchor="middle" class="small">registry de</text>
  <text x="960" y="309" text-anchor="middle" class="small">imagens</text>

  <!-- Dentro da VM -->
  <rect x="375" y="212" width="130" height="50" rx="3" class="node"/>
  <text x="440" y="233" text-anchor="middle">Runner self-hosted</text>
  <text x="440" y="250" text-anchor="middle">do GitHub</text>

  <rect x="550" y="170" width="120" height="46" rx="3" class="node"/>
  <text x="610" y="190" text-anchor="middle">Ingress (Traefik)</text>
  <text x="610" y="206" text-anchor="middle" class="small">porta 80</text>
  <rect x="550" y="262" width="120" height="46" rx="3" class="node"/>
  <text x="610" y="290" text-anchor="middle">Service api</text>
  <rect x="550" y="345" width="120" height="46" rx="3" class="node"/>
  <text x="610" y="364" text-anchor="middle" class="title">HPA</text>
  <text x="610" y="380" text-anchor="middle" class="small">CPU e memória</text>

  <rect x="710" y="258" width="140" height="56" rx="3" class="node" stroke-width="1.8"/>
  <text x="780" y="281" text-anchor="middle" class="title">api: 1 a 3 pods</text>
  <text x="780" y="298" text-anchor="middle" class="small">.NET 10, Clean Architecture</text>
  <rect x="710" y="345" width="140" height="46" rx="3" class="node"/>
  <text x="780" y="365" text-anchor="middle">Mailpit</text>
  <text x="780" y="381" text-anchor="middle" class="small">SMTP de teste (e-mails)</text>

  <!-- Azure SQL (cilindro) -->
  <path d="M560,452 v42 a120,9 0 0 0 240,0 v-42" class="node"/>
  <ellipse cx="680" cy="452" rx="120" ry="9" class="node"/>
  <text x="680" y="478" text-anchor="middle" class="title">Azure SQL Database</text>
  <text x="680" y="494" text-anchor="middle" class="small">oferta gratuita, pausa automática</text>

  <!-- Fluxos -->
  <path d="M140,64 V98" class="edge"/>
  <text x="148" y="86" class="label">PR feature → develop → release</text>
  <path d="M140,144 V178" class="edge"/>

  <path d="M260,237 H373" class="edge"/>
  <text x="318" y="230" text-anchor="middle" class="label">job de deploy</text>

  <path d="M140,290 V560 H960 V322" class="edge"/>
  <text x="550" y="556" text-anchor="middle" class="label">push da imagem (tag do commit)</text>

  <path d="M915,282 H852" class="edge"/>
  <text x="883" y="274" text-anchor="middle" class="label">pull</text>

  <path d="M470,262 V330 H538" class="edge"/>
  <text x="476" y="322" class="label">kubectl apply -k</text>

  <path d="M420,262 V477 H558" class="edge"/>
  <text x="428" y="468" class="label">sqlcmd: init.sql + seed</text>

  <path d="M610,54 V168" class="edge"/>
  <text x="618" y="128" class="label">HTTP</text>
  <path d="M610,216 V260" class="edge"/>
  <path d="M670,285 H708" class="edge"/>
  <path d="M780,314 V343" class="edge"/>
  <path d="M670,360 L733,316" class="edge dashed"/>

  <path d="M850,300 H870 V477 H802" class="edge"/>
</svg>
