# VM com k3s na Azure (infra/). Diferenças em relação ao local: o banco é o Azure SQL, fora do cluster
# (o schema é aplicado pelo pipeline, não por um Job), e a imagem vem do GHCR. Aplicado pelo job de deploy
# do CI/CD (.github/workflows/ci-release.yml), que antes troca a tag da imagem pelo commit e gera o
# api-secrets.env a partir dos GitHub Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiap-workshop

resources:
  - ../../base

images:
  - name: fiap-workshop-api
    newName: ghcr.io/humbertovitalino/fiap-postgraduated-workshop
    newTag: latest

secretGenerator:
  - name: api-secrets
    envs:
      - api-secrets.env
