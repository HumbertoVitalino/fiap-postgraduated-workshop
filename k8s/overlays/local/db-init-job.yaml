# Mesmo papel dos serviços sqlserver-init + sqlserver-seed-demo do docker-compose. Os dois scripts são
# idempotentes, então rodar o Job de novo não duplica nada (deploy.sh o recria a cada deploy).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sqlcmd
          image: mcr.microsoft.com/mssql/server:2022-latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b"
              # O SQL Server aceita conexão TCP (readinessProbe) antes de aceitar login.
              until $SQLCMD -Q "SELECT 1" > /dev/null 2>&1; do
                echo "Aguardando o SQL Server..."
                sleep 5
              done
              $SQLCMD -v DatabaseName=Fiap_Workshop -i /scripts/init.sql
              $SQLCMD -v DatabaseName=Fiap_Workshop -i /scripts/seed-demo.sql
          env:
            # Lida pelo próprio sqlcmd: a senha não aparece na linha de comando.
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secrets
                  key: SA_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: db-scripts
