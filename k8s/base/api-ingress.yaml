# No k3s, o Traefik já ocupa as portas 80/443 do nó; a api entra por ele, atrás de um Service ClusterIP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
