services:
  sql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: integration-sql
    environment:
      SA_PASSWORD: "Integration@Test123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Integration@Test123' -Q 'SELECT 1' -b -C || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s
